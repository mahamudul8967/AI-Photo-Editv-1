<html lang="en">

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {

            align-items: center;
            gap: 12px;
        }
        .logo-icon {

            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            font-weight: bold;
        }
        .logo-text {
            color: white;
            font-size: 20px;
            font-weight: 700;
        }
        .logo-text span {
            color: #e94560;
        }
        .nav {

            gap: 8px;
            align-items: center;
        }
        .nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        .nav .upgrade {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            font-weight: 600;
        }
        .nav .upgrade:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

            display: none;
            color: white;
            font-size: 28px;
            cursor: pointer;

        .hero p {

            max-width: 650px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: border-color 0.3s;

        .upload-zone:hover {
            border-color: #e94560;
        }
        .upload-icon {

            margin-bottom: 15px;
        }
        .upload-zone h2 {

        .upload-zone p {

            color: #f59e0b;

            margin-top: 12px;

            color: #333;
        }
        .testimonial-card .author span {
            color: #999;
            font-weight: 400;
        }
